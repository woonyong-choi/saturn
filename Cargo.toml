[workspace]
resolver = "3"
members = [
    "protocol",
    "terminal/core",
    "terminal/engine",
    "terminal/tui",
    "terminal/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
saturn-protocol = { path = "protocol" }
saturn-core = { path = "terminal/core" }
saturn-tui = { path = "terminal/tui" }

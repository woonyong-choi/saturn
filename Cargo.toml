[workspace]
resolver = "3"
members = [
    "saturn-protocol",
    "saturn-terminal/core",
    "saturn-terminal/engine",
    "saturn-terminal/tui",
    "saturn-terminal/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
saturn-protocol = { path = "saturn-protocol" }
saturn-core = { path = "saturn-terminal/core" }
saturn-engine = { path = "saturn-terminal/engine" }
saturn-tui = { path = "saturn-terminal/tui" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
flate2 = "1"
core-foundation-sys = "0.8"
keyring = { version = "3", features = ["apple-native"] }
libc = "0.2"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
schemars = "1"
security-framework-sys = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
thiserror = "2"
toml_edit = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "signal", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false }
tracing = "0.1"
ts-rs = "12"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_code = "warn"

[workspace.lints.clippy]
await_holding_lock = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
too_many_lines = "warn"
too_many_arguments = "warn"
fn_params_excessive_bools = "warn"
excessive_nesting = "warn"
cognitive_complexity = "warn"
if_not_else = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

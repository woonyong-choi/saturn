[workspace]
resolver = "3"
members = [
    "saturn-protocol",
    "saturn-terminal/core",
    "saturn-terminal/engine",
    "saturn-terminal/tui",
    "saturn-terminal/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
saturn-protocol = { path = "saturn-protocol" }
saturn-core = { path = "saturn-terminal/core" }
saturn-engine = { path = "saturn-terminal/engine" }
saturn-tui = { path = "saturn-terminal/tui" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
flate2 = "1"
keyring = { version = "3", features = ["apple-native"] }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
thiserror = "2"
toml_edit = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "signal", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

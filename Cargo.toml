[workspace]
resolver = "3"
members = [
    "saturn-protocol",
    "saturn-terminal/core",
    "saturn-terminal/engine",
    "saturn-terminal/tui",
    "saturn-terminal/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
saturn-protocol = { path = "saturn-protocol" }
saturn-core = { path = "saturn-terminal/core" }
saturn-tui = { path = "saturn-terminal/tui" }
